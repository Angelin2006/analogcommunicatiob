<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Modulation Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-900 text-gray-100 font-sans">

  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-3xl md:text-4xl font-bold text-center text-indigo-400 mb-6">
      Analog Modulation Visualizer
    </h1>
    <p class="text-center text-gray-400 mb-10">
      Experiment with AM, FM, DSB-SC, and SSB-SC waveforms interactively
    </p>

    <div class="grid md:grid-cols-4 gap-8">
      <!-- Controls -->
      <aside class="bg-gray-800 p-5 rounded-2xl shadow-lg md:col-span-1">
        <h2 class="text-xl font-semibold border-b border-gray-700 pb-3 mb-5">Controls</h2>

        <label class="block mb-2 font-medium">Modulation Type</label>
        <select id="modSelect" class="w-full mb-4 p-2 bg-gray-700 rounded text-gray-200">
          <option value="AM">Amplitude Modulation (AM)</option>
          <option value="FM">Frequency Modulation (FM)</option>
          <option value="DSB-SC">DSB-SC</option>
          <option value="SSB-SC">SSB-SC</option>
        </select>

        <div class="space-y-3">
          <div>
            <label class="block text-sm">Carrier Frequency (fc)</label>
            <input id="fc" type="number" value="2000" class="w-full p-2 bg-gray-700 rounded">
          </div>
          <div>
            <label class="block text-sm">Message Frequency (fm)</label>
            <input id="fm" type="number" value="200" class="w-full p-2 bg-gray-700 rounded">
          </div>
          <div>
            <label class="block text-sm">Carrier Amplitude (Ac)</label>
            <input id="ac" type="number" value="1" step="0.1" class="w-full p-2 bg-gray-700 rounded">
          </div>
          <div id="amDiv">
            <label class="block text-sm">Message Amplitude (Am)</label>
            <input id="am" type="number" value="0.5" step="0.1" class="w-full p-2 bg-gray-700 rounded">
          </div>
          <div id="betaDiv" class="hidden">
            <label class="block text-sm">Modulation Index (β)</label>
            <input id="beta" type="number" value="5" step="0.1" class="w-full p-2 bg-gray-700 rounded">
          </div>
        </div>

        <div id="formula" class="text-gray-400 mt-6 text-sm border-t border-gray-700 pt-3"></div>
      </aside>

      <!-- Charts -->
      <section class="md:col-span-3 space-y-8">
        <div class="bg-gray-800 p-5 rounded-2xl shadow-lg">
          <h3 class="text-lg font-semibold mb-3">Message Signal</h3>
          <canvas id="msgChart" height="150"></canvas>
        </div>
        <div class="bg-gray-800 p-5 rounded-2xl shadow-lg">
          <h3 class="text-lg font-semibold mb-3">Carrier Signal</h3>
          <canvas id="carChart" height="150"></canvas>
        </div>
        <div class="bg-gray-800 p-5 rounded-2xl shadow-lg">
          <h3 class="text-lg font-semibold mb-3">Modulated Signal</h3>
          <canvas id="modChart" height="150"></canvas>
        </div>
      </section>
    </div>
  </div>

          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { title: { display: true, text: "Time (s)" } },

          },

        }
      };
