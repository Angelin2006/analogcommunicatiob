<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Modulation Visualizer (Two Cycles)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

  <h1 class="text-3xl font-bold text-blue-700 mb-8">Analog Modulation Visualizer (Two Cycles)</h1>

  <!-- Input Container -->
  <div class="bg-white shadow-lg rounded-2xl p-8 w-11/12 md:w-3/4 lg:w-1/2">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- AM Parameters -->
      <div>
        <h2 class="text-lg font-semibold mb-4 text-gray-700">AM Parameters</h2>
        <label class="block text-sm text-gray-600">Carrier Frequency (Hz):</label>
        <input id="amCarrierFreq" type="number" value="1000" class="w-full p-2 mb-2 border rounded">
        <label class="block text-sm text-gray-600">Message Frequency (Hz):</label>
        <input id="amMessageFreq" type="number" value="100" class="w-full p-2 mb-2 border rounded">
        <label class="block text-sm text-gray-600">Carrier Amplitude:</label>
        <input id="amCarrierAmp" type="number" value="1" class="w-full p-2 mb-2 border rounded">
        <label class="block text-sm text-gray-600">Message Amplitude:</label>
        <input id="amMessageAmp" type="number" value="0.5" class="w-full p-2 mb-2 border rounded">
      </div>

      <!-- FM Parameters -->
      <div>
        <h2 class="text-lg font-semibold mb-4 text-gray-700">FM Parameters</h2>
        <label class="block text-sm text-gray-600">Carrier Frequency (Hz):</label>
        <input id="fmCarrierFreq" type="number" value="1000" class="w-full p-2 mb-2 border rounded">
        <label class="block text-sm text-gray-600">Message Frequency (Hz):</label>
        <input id="fmMessageFreq" type="number" value="100" class="w-full p-2 mb-2 border rounded">
        <label class="block text-sm text-gray-600">Frequency Deviation (Δf):</label>
        <input id="fmDeltaF" type="number" value="200" class="w-full p-2 mb-2 border rounded">
        <label class="block text-sm text-gray-600">Amplitude:</label>
        <input id="fmAmp" type="number" value="1" class="w-full p-2 mb-2 border rounded">
        <label class="block text-sm text-gray-600">Modulation Index (β):</label>
        <input id="fmBeta" type="number" value="2" class="w-full p-2 mb-2 border rounded">
      </div>
    </div>

    <!-- Generate Button -->
    <div class="flex justify-center mt-6">
      <button id="generateBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Generate</button>
    </div>
  </div>

  <!-- Buttons -->
  <div class="flex flex-wrap justify-center gap-4 mt-6">
    <button id="showAM" class="bg-red-500 text-white px-5 py-2 rounded-lg hover:bg-red-600">Show AM</button>
    <button id="showFM" class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700">Show FM</button>
    <button id="showDSBSC" class="bg-purple-600 text-white px-5 py-2 rounded-lg hover:bg-purple-700">Show DSB-SC</button>
    <button id="showSSBSC" class="bg-orange-500 text-white px-5 py-2 rounded-lg hover:bg-orange-600">Show SSB-SC</button>
  </div>

  <!-- Chart Area -->
  <div class="w-11/12 md:w-3/4 lg:w-1/2 mt-8 bg-white p-4 rounded-2xl shadow-lg">
    <canvas id="modulationChart"></canvas>
  </div>

  <script>
    let chart;
    let t, msg, carrierAM, carrierFM, amSignal, fmSignal, dsbscSignal, ssbscSignal;

    function generateSignals() {
      const amFc = parseFloat(document.getElementById("amCarrierFreq").value);
      const amFm = parseFloat(document.getElementById("amMessageFreq").value);
      const amAc = parseFloat(document.getElementById("amCarrierAmp").value);
      const amAm = parseFloat(document.getElementById("amMessageAmp").value);

      const fmFc = parseFloat(document.getElementById("fmCarrierFreq").value);
      const fmFm = parseFloat(document.getElementById("fmMessageFreq").value);
      const fmAmp = parseFloat(document.getElementById("fmAmp").value);
      const beta = parseFloat(document.getElementById("fmBeta").value);

      const fs = 100000;
      const duration = 2 / amFm;
      const dt = 1 / fs;
      t = Array.from({ length: Math.floor(duration * fs) }, (_, i) => i * dt);

      msg = t.map(time => amAm * Math.sin(2 * Math.PI * amFm * time));
      carrierAM = t.map(time => amAc * Math.sin(2 * Math.PI * amFc * time));
      amSignal = t.map(time => (amAc + amAm * Math.sin(2 * Math.PI * amFm * time)) * Math.sin(2 * Math.PI * amFc * time));

      carrierFM = t.map(time => fmAmp * Math.sin(2 * Math.PI * fmFc * time));
      fmSignal = t.map(time => fmAmp * Math.sin(2 * Math.PI * fmFc * time + beta * Math.sin(2 * Math.PI * fmFm * time)));

      dsbscSignal = t.map(time => amAm * Math.sin(2 * Math.PI * amFm * time) * Math.sin(2 * Math.PI * amFc * time));
      ssbscSignal = t.map((time, i) => {
        const m = Math.sin(2 * Math.PI * amFm * time);
        const h = Math.cos(2 * Math.PI * amFm * time); // Hilbert approx
        return amAc * (m * Math.cos(2 * Math.PI * amFc * time) + h * Math.sin(2 * Math.PI * amFc * time));
      });
      clearChart();
    }

    function clearChart() {
      if (chart) chart.destroy();
      const ctx = document.getElementById("modulationChart").getContext("2d");
      chart = new Chart(ctx, {
        type: "line",
        data: { labels: [], datasets: [] },
        options: {
          responsive: true,
          plugins: { legend: { display: true } },
          scales: { x: { display: false }, y: { title: { display: true, text: "Amplitude" } } }
        }
      });
    }

    function showModulation(type) {
      if (!t) return alert("Please click 'Generate' first!");
      if (chart) chart.destroy();

      const ctx = document.getElementById("modulationChart").getContext("2d");
      const data = {
        labels: t.slice(0, 1000),
        datasets: []
      };

      if (type === "AM") {
        data.datasets.push({ label: "Message Signal", data: msg.slice(0, 1000), borderColor: "black", borderWidth: 1 });
        data.datasets.push({ label: "Carrier Signal (AM)", data: carrierAM.slice(0, 1000), borderColor: "blue", borderWidth: 1 });
        data.datasets.push({ label: "AM Signal", data: amSignal.slice(0, 1000), borderColor: "red", borderWidth: 1 });
      } else if (type === "FM") {
        data.datasets.push({ label: "Message Signal", data: msg.slice(0, 1000), borderColor: "black", borderWidth: 1 });
        data.datasets.push({ label: "Carrier Signal (FM)", data: carrierFM.slice(0, 1000), borderColor: "blue", borderWidth: 1 });
        data.datasets.push({ label: "FM Signal", data: fmSignal.slice(0, 1000), borderColor: "red", borderWidth: 1 });
      } else if (type === "DSBSC") {
        data.datasets.push({ label: "Message Signal", data: msg.slice(0, 1000), borderColor: "black", borderWidth: 1 });
        data.datasets.push({ label: "Carrier Signal", data: carrierAM.slice(0, 1000), borderColor: "blue", borderWidth: 1 });
        data.datasets.push({ label: "DSB-SC Signal", data: dsbscSignal.slice(0, 1000), borderColor: "red", borderWidth: 1 });
      } else if (type === "SSBSC") {
        data.datasets.push({ label: "Message Signal", data: msg.slice(0, 1000), borderColor: "black", borderWidth: 1 });
        data.datasets.push({ label: "Carrier Signal", data: carrierAM.slice(0, 1000), borderColor: "blue", borderWidth: 1 });
        data.datasets.push({ label: "SSB-SC Signal", data: ssbscSignal.slice(0, 1000), borderColor: "red", borderWidth: 1 });
      }

      chart = new Chart(ctx, {
        type: "line",
        data,
        options: {
          responsive: true,
          plugins: { legend: { display: true } },
          scales: { x: { display: false }, y: { title: { display: true, text: "Amplitude" } } }
        }
      });
    }

    document.getElementById("generateBtn").addEventListener("click", generateSignals);
    document.getElementById("showAM").addEventListener("click", () => showModulation("AM"));
    document.getElementById("showFM").addEventListener("click", () => showModulation("FM"));
    document.getElementById("showDSBSC").addEventListener("click", () => showModulation("DSBSC"));
    document.getElementById("showSSBSC").addEventListener("click", () => showModulation("SSBSC"));

    clearChart();
  </script>

</body>
</html>
