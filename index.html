<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Modulation Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
  <h1 class="text-3xl font-bold mb-6 text-blue-700">Analog Modulation Visualizer</h1>

  <!-- Input Controls -->
  <div class="bg-white shadow-lg rounded-2xl p-6 w-full max-w-3xl mb-8">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-semibold">Message Frequency (Hz)</label>
        <input id="fm" type="number" value="5" class="border p-2 w-full rounded-md">
      </div>
      <div>
        <label class="block text-sm font-semibold">Carrier Frequency (Hz)</label>
        <input id="fc" type="number" value="50" class="border p-2 w-full rounded-md">
      </div>
      <div>
        <label class="block text-sm font-semibold">Amplitude (Message)</label>
        <input id="am" type="number" value="1" class="border p-2 w-full rounded-md">
      </div>
      <div>
        <label class="block text-sm font-semibold">Amplitude (Carrier)</label>
        <input id="ac" type="number" value="1" class="border p-2 w-full rounded-md">
      </div>
      <div>
        <label class="block text-sm font-semibold">FM Modulation Index (β)</label>
        <input id="beta" type="number" value="5" class="border p-2 w-full rounded-md">
      </div>
    </div>

    <div class="flex justify-center gap-4 mt-6">
      <button onclick="plotSignal('AM')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Show AM</button>
      <button onclick="plotSignal('FM')" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">Show FM</button>
      <button onclick="plotSignal('DSBSC')" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Show DSB-SC</button>
      <button onclick="plotSignal('SSBSC')" class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700">Show SSB-SC</button>
    </div>
  </div>

  <!-- Chart Section -->
  <div class="w-full max-w-4xl">
    <canvas id="chart1" class="mb-6"></canvas>
    <canvas id="chart2" class="mb-6"></canvas>
    <canvas id="chart3" class="mb-6"></canvas>
  </div>

  <script>
    let chart1, chart2, chart3;

    function plotSignal(type) {
      const fm = parseFloat(document.getElementById("fm").value);
      const fc = parseFloat(document.getElementById("fc").value);
      const am = parseFloat(document.getElementById("am").value);
      const ac = parseFloat(document.getElementById("ac").value);
      const beta = parseFloat(document.getElementById("beta").value);

      const fs = 1000; // sampling frequency
      const t = Array.from({ length: 400 }, (_, i) => i / fs); // only two cycles of AM
      const msg = t.map(x => am * Math.sin(2 * Math.PI * fm * x));
      const carrier = t.map(x => ac * Math.sin(2 * Math.PI * fc * x));
      let modulated = [];

      if (type === 'AM') {
        modulated = t.map(x => (ac * (1 + (am / ac) * Math.sin(2 * Math.PI * fm * x))) * Math.sin(2 * Math.PI * fc * x));
      } else if (type === 'FM') {
        modulated = t.map(x => ac * Math.sin(2 * Math.PI * fc * x + beta * Math.sin(2 * Math.PI * fm * x)));
      } else if (type === 'DSBSC') {
        modulated = t.map(x => am * Math.sin(2 * Math.PI * fm * x) * ac * Math.sin(2 * Math.PI * fc * x));
      } else if (type === 'SSBSC') {
        // Approximation using Hilbert transform concept (phase shifted message)
        const phaseShifted = t.map(x => am * Math.cos(2 * Math.PI * fm * x));
        modulated = t.map((x, i) => ac * (msg[i] * Math.cos(2 * Math.PI * fc * x) - phaseShifted[i] * Math.sin(2 * Math.PI * fc * x)));
      }

      drawChart('chart1', t, msg, 'Message Signal', 'blue');
      drawChart('chart2', t, carrier, 'Carrier Signal', 'green');
      drawChart('chart3', t, modulated, `${type} Modulated Signal`, 'red');
    }

    function drawChart(id, t, data, label, color) {
      const ctx = document.getElementById(id).getContext('2d');
      if (window[id]) window[id].destroy();

      window[id] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: t,
          datasets: [{
            label,
            data,
            borderColor: color,
            borderWidth: 2,
            fill: false,
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: {
              title: { display: true, text: 'Time (s)' }
            },
            y: {
              title: { display: true, text: 'Amplitude' }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
