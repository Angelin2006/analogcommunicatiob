<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Modulation Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 flex flex-col items-center min-h-screen p-6">
  <h1 class="text-3xl font-bold mb-6">Analog Modulation Visualizer</h1>

  <!-- Control buttons -->
  <div class="flex flex-wrap justify-center gap-4 mb-6">
    <button id="showAM" class="bg-red-500 text-white px-6 py-2 rounded-xl hover:bg-red-600">Show AM</button>
    <button id="showFM" class="bg-blue-500 text-white px-6 py-2 rounded-xl hover:bg-blue-600">Show FM</button>
    <button id="showDSBSC" class="bg-green-500 text-white px-6 py-2 rounded-xl hover:bg-green-600">Show DSB-SC</button>
    <button id="showSSBSC" class="bg-orange-500 text-white px-6 py-2 rounded-xl hover:bg-orange-600">Show SSB-SC</button>
  </div>

  <!-- Container for subplots -->
  <div class="w-full max-w-5xl bg-white shadow-lg rounded-2xl p-6">
    <canvas id="chart1" class="mb-4"></canvas>
    <canvas id="chart2" class="mb-4"></canvas>
    <canvas id="chart3"></canvas>
  </div>

  <script>
    const t = Array.from({ length: 500 }, (_, i) => i / 100);
    const fm = 2, fc = 20, Ac = 1, Am = 1, kf = 5;

    // Base signals
    const message = t.map(x => Am * Math.sin(2 * Math.PI * fm * x));
    const carrier = t.map(x => Ac * Math.sin(2 * Math.PI * fc * x));

    // Modulated signals
    const am = t.map(x => (Ac + Am * Math.sin(2 * Math.PI * fm * x)) * Math.sin(2 * Math.PI * fc * x));
    const fmSignal = t.map(x => Math.sin(2 * Math.PI * fc * x + kf * Math.sin(2 * Math.PI * fm * x)));
    const dsbsc = t.map(x => Am * Math.sin(2 * Math.PI * fm * x) * Math.sin(2 * Math.PI * fc * x));
    const ssbsc = t.map(x => Am * Math.sin(2 * Math.PI * (fc + fm) * x));

    let charts = [];

    function clearCharts() {
      charts.forEach(c => c.destroy());
      charts = [];
    }

    function plotSet(type) {
      clearCharts();

      let signal;
      if (type === 'AM') signal = am;
      else if (type === 'FM') signal = fmSignal;
      else if (type === 'DSBSC') signal = dsbsc;
      else signal = ssbsc;

      const ctx1 = document.getElementById("chart1");
      const ctx2 = document.getElementById("chart2");
      const ctx3 = document.getElementById("chart3");

      const commonOptions = {
        type: 'line',
        options: {
          responsive: true,
          scales: { x: { display: false }, y: { beginAtZero: false } },
          plugins: { legend: { display: true, position: 'top' } }
        }
      };

      charts.push(new Chart(ctx1, {
        ...commonOptions,
        data: { labels: t, datasets: [{ label: 'Message Signal', data: message, borderColor: 'black', borderWidth: 2, pointRadius: 0 }] }
      }));

      charts.push(new Chart(ctx2, {
        ...commonOptions,
        data: { labels: t, datasets: [{ label: 'Carrier Signal', data: carrier, borderColor: 'blue', borderWidth: 1, pointRadius: 0 }] }
      }));

      charts.push(new Chart(ctx3, {
        ...commonOptions,
        data: { labels: t, datasets: [{ label: `${type} Signal`, data: signal, borderColor: 'red', borderWidth: 1, pointRadius: 0 }] }
      }));
    }

    // Initially empty
    clearCharts();

    document.getElementById("showAM").addEventListener("click", () => plotSet('AM'));
    document.getElementById("showFM").addEventListener("click", () => plotSet('FM'));
    document.getElementById("showDSBSC").addEventListener("click", () => plotSet('DSBSC'));
    document.getElementById("showSSBSC").addEventListener("click", () => plotSet('SSBSC'));
  </script>
</body>
</html>
