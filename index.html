<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Modulation Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col items-center min-h-screen p-6">

  <h1 class="text-3xl font-bold mb-6 text-center">Analog Modulation Visualizer (Two Cycles)</h1>

  <!-- Input Section -->
  <div class="grid grid-cols-2 gap-4 mb-6 w-full max-w-3xl bg-white p-6 rounded-2xl shadow">
    <div>
      <h2 class="text-lg font-semibold mb-2">AM Parameters</h2>
      <label class="block mb-2">Carrier Frequency (Hz):</label>
      <input id="amFc" type="number" value="5770" class="w-full border p-2 rounded">
      <label class="block mb-2 mt-3">Message Frequency (Hz):</label>
      <input id="amFm" type="number" value="577" class="w-full border p-2 rounded">
      <label class="block mb-2 mt-3">Carrier Amplitude:</label>
      <input id="amAc" type="number" value="9.6" class="w-full border p-2 rounded">
      <label class="block mb-2 mt-3">Message Amplitude:</label>
      <input id="amAm" type="number" value="4.8" class="w-full border p-2 rounded">
    </div>

   <div>
  <h2 class="text-lg font-semibold mb-2">FM Parameters</h2>
  <label class="block mb-2">Carrier Frequency (Hz):</label>
  <input id="fmFc" type="number" value="5770" class="w-full border p-2 rounded">
  
  <label class="block mb-2 mt-3">Message Frequency (Hz):</label>
  <input id="fmFm" type="number" value="577" class="w-full border p-2 rounded">
  
  <label class="block mb-2 mt-3">Frequency Deviation:</label>
  <input id="fmDev" type="number" value="2000" class="w-full border p-2 rounded">
  
  <label class="block mb-2 mt-3">Amplitude:</label>
  <input id="fmAmp" type="number" value="9.6" class="w-full border p-2 rounded">
  
  <label class="block mb-2 mt-3">Modulation Index (Beta):</label>
  <input id="fmBeta" type="number" value="3.466" readonly class="w-full border p-2 rounded bg-gray-100"> 
</div>
  </div>

  <button onclick="generateSignals()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold mb-6">Generate</button>

  <!-- Chart -->
  <div class="w-full max-w-5xl bg-white p-4 rounded-2xl shadow">
    <canvas id="waveCanvas" height="150"></canvas>
  </div>

  <script>
    let chart;

    function generateSignals() {
      const amFc = parseFloat(document.getElementById('amFc').value);
      const amFm = parseFloat(document.getElementById('amFm').value);
      const amAc = parseFloat(document.getElementById('amAc').value);
      const amAm = parseFloat(document.getElementById('amAm').value);

      const fmFc = parseFloat(document.getElementById('fmFc').value);
      const fmFm = parseFloat(document.getElementById('fmFm').value);
      const fmDev = parseFloat(document.getElementById('fmDev').value);
      const fmAmp = parseFloat(document.getElementById('fmAmp').value);

      // Time axis for 2 cycles of lowest message frequency
      const t = [];
      const step = 1 / (amFc * 100);
      const totalTime = 2 / amFm;
      for (let x = 0; x <= totalTime; x += step) t.push(x);

      // Message signal
      const m = t.map(x => Math.sin(2 * Math.PI * amFm * x));

      // AM Signal
      const am = t.map(x => (amAc + amAm * Math.sin(2 * Math.PI * amFm * x)) * Math.sin(2 * Math.PI * amFc * x));

      // FM Signal
      const fm = t.map(x => fmAmp * Math.sin(2 * Math.PI * (fmFc * x + ((fmDev / fmFm) * Math.sin(2 * Math.PI * fmFm * x)))));

      // DSB-SC
      const dsbsc = t.map(x => amAm * Math.sin(2 * Math.PI * amFm * x) * Math.sin(2 * Math.PI * amFc * x));

      // SSB-SC (approximation using Hilbert transform concept)
      const ssbsc = t.map((x, i) => amAm * Math.sin(2 * Math.PI * amFm * x) * Math.cos(2 * Math.PI * amFc * x) - amAm * Math.cos(2 * Math.PI * amFm * x) * Math.sin(2 * Math.PI * amFc * x));

      // Plot
      const ctx = document.getElementById('waveCanvas').getContext('2d');
      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: t.map(x => x.toFixed(4)),
          datasets: [
            { label: 'AM', data: am, borderColor: 'red', borderWidth: 1, fill: false },
            { label: 'FM', data: fm, borderColor: 'blue', borderWidth: 1, fill: false },
            { label: 'DSB-SC', data: dsbsc, borderColor: 'green', borderWidth: 1, fill: false },
            { label: 'SSB-SC', data: ssbsc, borderColor: 'orange', borderWidth: 1, fill: false }
          ]
        },
        options: {
          responsive: true,
          animation: false,
          scales: {
            x: { title: { display: true, text: 'Time (s)' }, ticks: { maxTicksLimit: 8 } },
            y: { title: { display: true, text: 'Amplitude' } }
          },
          plugins: { legend: { position: 'top' } }
        }
      });
    }

    window.onload = generateSignals;
  </script>

</body>
</html>
