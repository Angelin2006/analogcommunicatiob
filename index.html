<script>
  let t = [], msg = [], carAM = [], carFM = [];
  let am = [], fmSig = [], dsbsc = [], ssbsc = [];
  let chart;
  let selectedType = null;

  // Generate signals
  document.getElementById("generateBtn").onclick = function () {
    const amFreq = parseFloat(document.getElementById("amFreq").value);
    const amAmp = parseFloat(document.getElementById("amAmp").value);
    const fmFreq = parseFloat(document.getElementById("fmFreq").value);
    const fmAmp = parseFloat(document.getElementById("fmAmp").value);
    const beta = parseFloat(document.getElementById("modIndex").value);

    const fm = 2; // message frequency
    t = Array.from({ length: 1000 }, (_, i) => i / 1000 * (2 / fm));
    msg = t.map(x => Math.sin(2 * Math.PI * fm * x));
    carAM = t.map(x => amAmp * Math.sin(2 * Math.PI * amFreq * x));
    carFM = t.map(x => fmAmp * Math.sin(2 * Math.PI * fmFreq * x));

    am = t.map(x => (1 + 0.5 * Math.sin(2 * Math.PI * fm * x)) * Math.sin(2 * Math.PI * amFreq * x));
    fmSig = t.map(x => fmAmp * Math.sin(2 * Math.PI * fmFreq * x + beta * Math.sin(2 * Math.PI * fm * x)));
    dsbsc = t.map(x => msg[Math.floor(x * 500)] * Math.sin(2 * Math.PI * amFreq * x));
    ssbsc = dsbsc.map(x => x * 0.7); // simplified for display

    alert("✅ Signals generated! Now select modulation type and view signals.");
  };

  // Function to draw a single plot
  function plotSingle(label, data, color) {
    if (chart) chart.destroy();
    const ctx = document.getElementById("modChart").getContext("2d");
    chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: t,
        datasets: [
          {
            label: label,
            data: data,
            borderColor: color,
            fill: false,
            borderWidth: 2,
          },
        ],
      },
      options: {
        responsive: true,
        animation: false,
        plugins: { legend: { display: true } },
        scales: {
          x: { title: { display: true, text: "Time (s)" } },
          y: { title: { display: true, text: "Amplitude" } },
        },
      },
    });
  }

  // Modulation selection
  document.getElementById("showAM").onclick = () => selectedType = "AM";
  document.getElementById("showFM").onclick = () => selectedType = "FM";
  document.getElementById("showDSBSC").onclick = () => selectedType = "DSBSC";
  document.getElementById("showSSBSC").onclick = () => selectedType = "SSBSC";

  // Show buttons
  document.getElementById("showMsg").onclick = () => {
    if (!selectedType) return alert("⚠️ Please select a modulation type first!");
    plotSingle("Message Signal", msg, "black");
  };

  document.getElementById("showCarrier").onclick = () => {
    if (!selectedType) return alert("⚠️ Please select a modulation type first!");
    if (selectedType === "AM" || selectedType === "DSBSC" || selectedType === "SSBSC")
      plotSingle("Carrier Signal (AM)", carAM, "blue");
    else
      plotSingle("Carrier Signal (FM)", carFM, "blue");
  };

  document.getElementById("showOutput").onclick = () => {
    if (!selectedType) return alert("⚠️ Please select a modulation type first!");
    if (selectedType === "AM") plotSingle("AM Signal", am, "red");
    else if (selectedType === "FM") plotSingle("FM Signal", fmSig, "green");
    else if (selectedType === "DSBSC") plotSingle("DSB-SC Signal", dsbsc, "purple");
    else if (selectedType === "SSBSC") plotSingle("SSB-SC Signal", ssbsc, "orange");
  };
</script>
