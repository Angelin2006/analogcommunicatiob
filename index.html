<script>
  let t = [], msg = [], carrier = [], am = [], fm = [], dsb = [], ssb = [];
  const fs = 200000; // High sample rate for smooth plot
  let dataGenerated = false;
  let currentShown = "";

  const msgCtx = document.getElementById("msgChart").getContext("2d");
  const carrierCtx = document.getElementById("carrierChart").getContext("2d");
  const modCtx = document.getElementById("modChart").getContext("2d");

  let msgChart, carrierChart, modChart;

  function clearCharts() {
    [msgChart, carrierChart, modChart].forEach(chart => chart && chart.destroy());
  }

  function generateSignals() {
    const fmVal = parseFloat(document.getElementById("fm").value);
    const fcVal = parseFloat(document.getElementById("fc").value);
    const Am = parseFloat(document.getElementById("Am").value);
    const Ac = parseFloat(document.getElementById("Ac").value);
    const beta = parseFloat(document.getElementById("beta").value);

    // ✅ Two cycles of the MESSAGE signal
    const Tm = 1 / fmVal;
    const duration = 2 * Tm; // exactly 2 message cycles
    const N = Math.floor(duration * fs);

    t = Array.from({ length: N }, (_, i) => i / fs);
    msg = t.map(tt => Am * Math.cos(2 * Math.PI * fmVal * tt)); // cosine for same phase look
    carrier = t.map(tt => Ac * Math.cos(2 * Math.PI * fcVal * tt));
    am = t.map(tt => (Ac * (1 + (Am / Ac) * Math.cos(2 * Math.PI * fmVal * tt))) * Math.cos(2 * Math.PI * fcVal * tt));
    fm = t.map(tt => Ac * Math.cos(2 * Math.PI * fcVal * tt + beta * Math.sin(2 * Math.PI * fmVal * tt)));
    dsb = t.map(tt => Am * Math.cos(2 * Math.PI * fmVal * tt) * Math.cos(2 * Math.PI * fcVal * tt));
    ssb = t.map(tt => Am * Math.cos(2 * Math.PI * fmVal * tt) * Math.sin(2 * Math.PI * fcVal * tt));

    dataGenerated = true;
    alert("Two smooth cycles generated successfully!");
  }

  function showSignal(type) {
    if (!dataGenerated) {
      alert("Please click 'Generate' first!");
      return;
    }

    // toggle off
    if (currentShown === type) {
      clearCharts();
      currentShown = "";
      return;
    }

    clearCharts();

    const chartOptions = {
      type: "line",
      options: {
        plugins: { legend: { display: true } },
        scales: {
          x: {
            display: true,
            title: { display: true, text: "Time (s)" },
            ticks: { maxTicksLimit: 6 }
          },
          y: { display: true, title: { display: true, text: "Amplitude" } }
        },
        elements: { point: { radius: 0 } }
      }
    };

    msgChart = new Chart(msgCtx, {
      ...chartOptions,
      data: { labels: t, datasets: [{ label: "Message Signal", data: msg, borderColor: "black", borderWidth: 1 }] }
    });

    carrierChart = new Chart(carrierCtx, {
      ...chartOptions,
      data: { labels: t, datasets: [{ label: "Carrier Signal", data: carrier, borderColor: "blue", borderWidth: 1 }] }
    });

    let modData = [], label = "", color = "red";
    switch (type) {
      case "AM": modData = am; label = "AM Signal"; break;
      case "FM": modData = fm; label = "FM Signal"; break;
      case "DSB": modData = dsb; label = "DSB-SC Signal"; break;
      case "SSB": modData = ssb; label = "SSB-SC Signal"; break;
    }

    modChart = new Chart(modCtx, {
      ...chartOptions,
      data: { labels: t, datasets: [{ label, data: modData, borderColor: color, borderWidth: 1 }] }
    });

    currentShown = type;
  }

  document.getElementById("generateBtn").addEventListener("click", generateSignals);
  document.getElementById("showAM").addEventListener("click", () => showSignal("AM"));
  document.getElementById("showFM").addEventListener("click", () => showSignal("FM"));
  document.getElementById("showDSB").addEventListener("click", () => showSignal("DSB"));
  document.getElementById("showSSB").addEventListener("click", () => showSignal("SSB"));
</script>
