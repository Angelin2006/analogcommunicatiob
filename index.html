<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog Modulation Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6" onload="initializeCharts()">
  <h1 class="text-3xl font-bold mb-6 text-blue-700">Analog Modulation Visualizer</h1>

  <div class="bg-white shadow-lg rounded-2xl p-6 w-full max-w-3xl mb-8">
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-semibold">Message Frequency (Hz)</label>
        <input id="fm" type="number" value="5" class="border p-2 w-full rounded-md">
      </div>
      <div>
        <label class="block text-sm font-semibold">Carrier Frequency (Hz)</label>
        <input id="fc" type="number" value="50" class="border p-2 w-full rounded-md">
      </div>
      <div>
        <label class="block text-sm font-semibold">Amplitude (Message)</label>
        <input id="am" type="number" value="1" class="border p-2 w-full rounded-md">
      </div>
      <div>
        <label class="block text-sm font-semibold">Amplitude (Carrier)</label>
        <input id="ac" type="number" value="1" class="border p-2 w-full rounded-md">
      </div>
      <div>
        <label class="block text-sm font-semibold">FM Modulation Index (β)</label>
        <input id="beta" type="number" value="5" class="border p-2 w-full rounded-md">
      </div>
    </div>

    <div class="flex justify-center gap-4 mt-6">
      <button onclick="plotMessage()" class="bg-yellow-600 text-white px-4 py-2 rounded-lg hover:bg-yellow-700">Show Message</button>
      <button onclick="plotCarrier()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Show Carrier</button>
    </div>

    <div class="flex justify-center gap-4 mt-4">
      <button onclick="plotModulated('AM')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Show AM</button>
      <button onclick="plotModulated('FM')" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">Show FM</button>
      <button onclick="plotModulated('DSBSC')" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">Show DSB-SC</button>
      <button onclick="plotModulated('SSBSC')" class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700">Show SSB-SC</button>
    </div>
  </div>

  <div class="w-full max-w-4xl">
    <canvas id="chart1" class="mb-6"></canvas>
    <canvas id="chart2" class="mb-6"></canvas>
    <canvas id="chart3" class="mb-6"></canvas>
  </div>

  <script>
    let chart1, chart2, chart3;
    let t = [];
    let msg = [];
    let carrier = [];

    const fs = 1000; // sampling frequency
    const sampleLength = 400;

    function getParams() {
      const fm = parseFloat(document.getElementById("fm").value);
      const fc = parseFloat(document.getElementById("fc").value);
      const am = parseFloat(document.getElementById("am").value);
      const ac = parseFloat(document.getElementById("ac").value);
      const beta = parseFloat(document.getElementById("beta").value);
      return { fm, fc, am, ac, beta };
    }

    function calculateSignals() {
      const { fm, fc, am, ac } = getParams();

      t = Array.from({ length: sampleLength }, (_, i) => i / fs);
      msg = t.map(x => am * Math.sin(2 * Math.PI * fm * x));
      carrier = t.map(x => ac * Math.sin(2 * Math.PI * fc * x));
    }

    function initializeCharts() {
      // Calculate initial signals
      calculateSignals();

      // Draw initial empty charts
      drawChart('chart1', t, [], 'Message Signal', 'blue');
      drawChart('chart2', t, [], 'Carrier Signal', 'green');
      drawChart('chart3', t, [], 'Modulated Signal', 'red');
    }
    
    function plotMessage() {
        calculateSignals(); // Recalculate based on current inputs
        drawChart('chart1', t, msg, 'Message Signal', 'blue');
        // Clear other charts (optional, but ensures only message is shown)
        drawChart('chart2', t, [], 'Carrier Signal', 'green');
        drawChart('chart3', t, [], 'Modulated Signal', 'red');
    }

    function plotCarrier() {
        calculateSignals(); // Recalculate based on current inputs
        drawChart('chart2', t, carrier, 'Carrier Signal', 'green');
        // Clear other charts
        drawChart('chart1', t, [], 'Message Signal', 'blue');
        drawChart('chart3', t, [], 'Modulated Signal', 'red');
    }

    function plotModulated(type) {
      const { fm, fc, am, ac, beta } = getParams();
      calculateSignals(); // Ensure message and carrier are up to date

      let modulated = [];

      if (type === 'AM') {
        modulated = t.map(x => (ac * (1 + (am / ac) * Math.sin(2 * Math.PI * fm * x))) * Math.sin(2 * Math.PI * fc * x));
      } else if (type === 'FM') {
        modulated = t.map(x => ac * Math.sin(2 * Math.PI * fc * x + beta * Math.sin(2 * Math.PI * fm * x)));
      } else if (type === 'DSBSC') {
        modulated = t.map(x => am * Math.sin(2 * Math.PI * fm * x) * ac * Math.sin(2 * Math.PI * fc * x));
      } else if (type === 'SSBSC') {
        // Approximation using Hilbert transform concept (phase shifted message)
        const phaseShifted = t.map(x => am * Math.cos(2 * Math.PI * fm * x));
        modulated = t.map((x, i) => ac * (msg[i] * Math.cos(2 * Math.PI * fc * x) - phaseShifted[i] * Math.sin(2 * Math.PI * fc * x)));
      }

      // Plot the modulated signal in chart 3
      drawChart('chart3', t, modulated, `${type} Modulated Signal`, 'red');
      
      // Clear other charts
      drawChart('chart1', t, [], 'Message Signal', 'blue');
      drawChart('chart2', t, [], 'Carrier Signal', 'green');
    }

    // The core plotting function remains the same
    function drawChart(id, t, data, label, color) {
      const ctx = document.getElementById(id).getContext('2d');
      if (window[id]) window[id].destroy(); // Destroy previous instance

      // Only plot if data is available, otherwise show empty axes
      const datasets = data.length > 0 ? [{
            label,
            data,
            borderColor: color,
            borderWidth: 2,
            fill: false,
            pointRadius: 0 // Remove points for cleaner wave
          }] : [];

      window[id] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: t,
          datasets: datasets
        },
        options: {
          responsive: true,
          animation: false, // Disable animation for faster updates
          scales: {
            x: {
              title: { display: true, text: 'Time (s)' },
              // Set a fixed range for better comparison, max time is sampleLength/fs
              min: 0,
              max: sampleLength / fs, 
            },
            y: {
              title: { display: true, text: 'Amplitude' },
              // Use a reasonable max/min amplitude based on potential inputs (e.g. up to 10)
              min: -10, 
              max: 10,
            }
          },
          plugins: {
            legend: {
                display: datasets.length > 0 // Hide legend if no data is plotted
            }
          }
        }
      });
    }
  </script>
</body>
</html>
