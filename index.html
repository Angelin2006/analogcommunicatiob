<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Modulation Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* make canvases visually similar to your reference */
    .plot-card { background:white; border-radius:12px; padding:18px; box-shadow:0 6px 18px rgba(0,0,0,0.08); }
    canvas { width:100% !important; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-start justify-center p-8">
  <div class="w-full max-w-5xl">
    <div class="plot-card mb-6">
      <h1 class="text-2xl font-bold text-center mb-4">Analog Modulation Visualizer (2 cycles)</h1>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium">Message frequency f<sub>m</sub> (Hz)</label>
          <input id="fm" type="number" value="387" class="mt-1 w-full border rounded p-2" />
        </div>
        <div>
          <label class="block text-sm font-medium">Carrier frequency f<sub>c</sub> (Hz)</label>
          <input id="fc" type="number" value="3870" class="mt-1 w-full border rounded p-2" />
        </div>
        <div>
          <label class="block text-sm font-medium">Message amplitude A<sub>m</sub></label>
          <input id="Am" type="number" value="4.7" class="mt-1 w-full border rounded p-2" />
        </div>
        <div>
          <label class="block text-sm font-medium">Carrier amplitude A<sub>c</sub></label>
          <input id="Ac" type="number" value="9.4" class="mt-1 w-full border rounded p-2" />
        </div>
        <div class="col-span-2">
          <label class="block text-sm font-medium">FM modulation index β</label>
          <input id="beta" type="number" value="2.55" class="mt-1 w-full border rounded p-2" />
        </div>
      </div>

      <div class="flex justify-center gap-3 mb-2">
        <button id="generateBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Generate</button>
        <button id="showAM" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Show AM</button>
        <button id="showFM" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Show FM</button>
        <button id="showDSB" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">Show DSB-SC</button>
        <button id="showSSB" class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">Show SSB-SC</button>
      </div>
    </div>

    <div class="plot-card space-y-6">
      <canvas id="msgCanvas" height="120"></canvas>
      <canvas id="carrierCanvas" height="120"></canvas>
      <canvas id="modCanvas" height="140"></canvas>
    </div>
  </div>

  <script>
    let t = [], msg = [], carrier = [], am = [], fmSig = [], dsb = [], ssb = [];
    let generated = false, current = "";
    // High sampling rate for smooth curve visualization
    const fs = 200000; 

    // chart instances
    let msgChart = null, carrierChart = null, modChart = null;

    function clearAllCharts(){
      [msgChart, carrierChart, modChart].forEach(c => { if(c) c.destroy(); });
      msgChart = carrierChart = modChart = null;
      current = "";
    }

    function generate() {
      // Get input values
      const fmVal = parseFloat(document.getElementById('fm').value);
      const fcVal = parseFloat(document.getElementById('fc').value);
      const Am = parseFloat(document.getElementById('Am').value);
      const Ac = parseFloat(document.getElementById('Ac').value);
      const beta = parseFloat(document.getElementById('beta').value);

      if(!(fmVal > 0 && fcVal > 0)) { alert('Set positive fm and fc'); return; }

      // Time array (2 cycles of message signal)
      const Tm = 1 / fmVal;
      const duration = 2 * Tm;
      const N = Math.max(2000, Math.floor(duration * fs)); 
      t = Array.from({length: N}, (_, i) => i * (duration / (N - 1)));

      // Message and Carrier (use cosine)
      msg = t.map(tt => Am * Math.cos(2 * Math.PI * fmVal * tt));
      carrier = t.map(tt => Ac * Math.cos(2 * Math.PI * fcVal * tt));
      
      // AM (Standard): Ac * (1 + mu * cos(wm*t)) * cos(wc*t) where mu = Am/Ac
      am = t.map(tt => (Ac * (1 + (Am / Ac) * Math.cos(2 * Math.PI * fmVal * tt))) * Math.cos(2 * Math.PI * fcVal * tt));
      
      // FM: Ac * cos(wc*t + beta * sin(wm*t))
      fmSig = t.map(tt => Ac * Math.cos(2 * Math.PI * fcVal * tt + beta * Math.sin(2 * Math.PI * fmVal * tt)));
      
      // DSB-SC: Simple product m(t) * c(t)
      dsb = t.map(tt => Am * Math.cos(2 * Math.PI * fmVal * tt) * Math.cos(2 * Math.PI * fcVal * tt));
      
      // SSB-SC (USB - Upper Sideband) - Corrected Amplitude for Visibility
      // SSB = Am * [ m(t)*cos(wc*t) - m_hat(t)*sin(wc*t) ]
      // Using 'Am' as the overall amplitude factor to ensure visibility on the plot.
      const amplitudeFactor = Am; 
      ssb = t.map(tt => 
        // In-phase Component: m(t) * cos(wc*t)
        (amplitudeFactor * Math.cos(2 * Math.PI * fmVal * tt) * Math.cos(2 * Math.PI * fcVal * tt)) - 
        // Quadrature Component: m_hat(t) * sin(wc*t)
        (amplitudeFactor * Math.sin(2 * Math.PI * fmVal * tt) * Math.sin(2 * Math.PI * fcVal * tt))   
      );

      generated = true;
      clearAllCharts(); 
      alert('Generated two-cycle signals. Click any "Show" button to view.');
    }

    function plotThree(type) {
      if(!generated){ alert('Click Generate first'); return; }

      // toggle: clicking same button clears view
      if(current === type){ clearAllCharts(); return; }

      clearAllCharts();

      const baseOptions = (xShow=false) => ({
        responsive:true, animation:false,
        plugins:{ legend:{ display:true, labels: { boxWidth:12 } } },
        scales:{
          x:{ display: xShow, title:{display:xShow, text:'Time (s)'}, ticks:{maxTicksLimit:6} },
          y:{ display:true, title:{display:true, text:'Amplitude'} }
        },
        elements:{ point:{ radius:0 }, line:{ tension:0 } }
      });

      // 1. Message Chart
      msgChart = new Chart(document.getElementById('msgCanvas').getContext('2d'), {
        type:'line',
        data:{ labels:t, datasets:[{ label:'Message Signal (m(t))', data:msg, borderColor:'black', borderWidth:1 }]},
        options: baseOptions(false)
      });

      // 2. Carrier Chart
      carrierChart = new Chart(document.getElementById('carrierCanvas').getContext('2d'), {
        type:'line',
        data:{ labels:t, datasets:[{ label:'Carrier Signal (c(t))', data:carrier, borderColor:'blue', borderWidth:1 }]},
        options: baseOptions(false)
      });

      // 3. Modulation Chart
      let dataset = [], color='red', lab='';
      if(type==='AM'){ dataset = am; color='red'; lab='AM Signal'; }
      else if(type==='FM'){ dataset = fmSig; color='green'; lab='FM Signal'; }
      else if(type==='DSB'){ dataset = dsb; color='purple'; lab='DSB-SC Signal'; }
      else if(type==='SSB'){ dataset = ssb; color='orange'; lab='SSB-SC Signal (USB)'; }

      modChart = new Chart(document.getElementById('modCanvas').getContext('2d'), {
        type:'line',
        data:{ labels:t, datasets:[{ label: lab, data: dataset, borderColor: color, borderWidth:1 }]},
        options: baseOptions(true)
      });

      current = type;
    }

    // attach events
    document.getElementById('generateBtn').addEventListener('click', generate);
    document.getElementById('showAM').addEventListener('click', ()=>plotThree('AM'));
    document.getElementById('showFM').addEventListener('click', ()=>plotThree('FM'));
    document.getElementById('showDSB').addEventListener('click', ()=>plotThree('DSB'));
    document.getElementById('showSSB').addEventListener('click', ()=>plotThree('SSB'));
  </script>
</body>
</html>
